[project]
name = "cast-agents"
version = "0.2.0"
description = "Cast 平台 agent 后端装配商 · 直装 akong-runtime + 5 utility + cast-platform-tools · FC v3 部署 (老板 5-9 拍 砍 meta-package)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "akong-runtime @ git+https://github.com/yarnovo/akong-runtime.git@main",
    "akong-llm @ git+https://github.com/yarnovo/akong-llm.git@main",
    "akong-session @ git+https://github.com/yarnovo/akong-session.git@main",
    "akong-memory @ git+https://github.com/yarnovo/akong-memory.git@main",
    "akong-tools @ git+https://github.com/yarnovo/akong-tools.git@main",
    "akong-skills @ git+https://github.com/yarnovo/akong-skills.git@main",
    "cast-platform-tools @ git+https://github.com/yarnovo/cast-platform-tools.git@feat/direct-import-tools",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cast_agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
