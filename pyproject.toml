[project]
name = "cast-agents"
version = "0.1.0"
description = "Cast 平台 agent 后端装配商 · 装 akong-agent-harness + cast-platform-tools · FC v3 部署"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "akong-agent-harness @ git+https://github.com/yarnovo/akong-agent-harness.git@main",
    "cast-platform-tools @ git+https://github.com/yarnovo/cast-platform-tools.git@main",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cast_agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
