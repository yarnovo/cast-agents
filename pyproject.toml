[project]
name = "cast-agents"
version = "0.1.0"
description = "Cast 平台「阿空小造」meta-agent 后端 · 单 endpoint 对话造虚拟角色 · FC v3 部署"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.35.1",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cast_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
