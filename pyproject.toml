[project]
name = "cast-agents"
version = "0.1.0"
description = "Cast 平台 agent 后端装配商 · 装 akong-agent-harness + cast-platform-tools · FC v3 部署"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "akong-agent-harness",
    "cast-platform-tools",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.6.1",
]

[tool.uv.sources]
# 本地 dev 用 path source (sibling 布局: ~/.claude/repos/agent/{harness,tools})
# CI / Docker build 改 git source (cast-platform-tools 仓 pyproject 同步改) · 见 README.md §部署
akong-agent-harness = { path = "../../agent/akong-agent-harness", editable = true }
cast-platform-tools = { path = "../../agent/cast-platform-tools", editable = true }

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cast_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
