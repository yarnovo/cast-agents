name: deploy-staging
# cast-agents · staging FC v3 Custom Container · ACR (push develop → -staging 后缀)

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "skills/**"
      - "workspace/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

env:
  REGION: cn-hangzhou
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_VPC: registry-vpc.cn-hangzhou.aliyuncs.com
  NAMESPACE: agentaily
  IMAGE_NAME: cast-agents
  FC_FUNCTION: cast-agents-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone akong-agent-base v0.2
        run: |
          git clone --depth 1 --branch v0.2.0 https://github.com/yarnovo/akong-agent-base.git akong-agent-base

      - name: Clone cast-skills (build context · 容器内 SKILL.md 真源)
        run: |
          git clone --depth 1 https://github.com/yarnovo/cast-skills.git cast-skills
          ls cast-skills/skills

      # 老板 5-9 拍拆仓: cast-builtin-agents 已 archive
      # · meta agent yaml 由 meta-hermes wheel 自带 · 不需 clone
      # · demo agent yaml 由 demo-agents wheel 自带 (staging 装 · INSTALL_DEMO=1)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            INSTALL_DEMO=1
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup aliyun CLI
        run: |
          curl -sLo /tmp/aliyun.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun.tgz -C /tmp && sudo mv /tmp/aliyun /usr/local/bin/
          aliyun configure set --profile gha --mode AK \
            --region $REGION \
            --access-key-id "${{ secrets.ALIYUN_AK }}" \
            --access-key-secret "${{ secrets.ALIYUN_SK }}"

      - name: Update FC v3 staging function
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          IMAGE_VPC="${{ env.REGISTRY_VPC }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}"
          BODY=$(cat <<JSON
          {
            "functionName": "${FC_FUNCTION}",
            "runtime": "custom-container",
            "handler": "not-used",
            "timeout": 600,
            "memorySize": 512,
            "instanceConcurrency": 5,
            "customContainerConfig": {
              "image": "$IMAGE_VPC",
              "port": 8000,
              "healthCheckConfig": {"httpGetUrl": "/health", "initialDelaySeconds": 5}
            },
            "environmentVariables": {
              "DASHSCOPE_API_KEY": "$DASHSCOPE_API_KEY",
              "LLM_API_KEY": "$DASHSCOPE_API_KEY",
              "AKONG_LLM_API_KEY": "$DASHSCOPE_API_KEY",
              "AKONG_LLM_BASE_URL": "https://dashscope.aliyuncs.com/compatible-mode/v1",
              "AKONG_LLM_MODEL": "deepseek-v3.1",
              "ENV": "staging",
              "API_BASE_URL": "https://api.staging.cast.agentaily.com",
              "CAST_INSTALL_DEMO_AGENTS": "1"
            }
          }
          JSON
          )
          if ! aliyun --profile gha fc PUT "/2023-03-30/functions/${FC_FUNCTION}" \
              --header "Content-Type=application/json;" --body "$BODY" 2>&1 | tee /tmp/fc.log | tail -5; then true; fi
          if grep -q "FunctionNotFound\|can not find" /tmp/fc.log 2>/dev/null; then
            aliyun --profile gha fc POST /2023-03-30/functions \
              --header "Content-Type=application/json;" --body "$BODY" 2>&1 | tail -5
          fi

      - name: Smoke
        run: |
          echo "✓ staging deployed: image=$IMAGE_VPC"
          curl -fsSL "https://staging.api.cast-agents.agentaily.com/health?cb=$RANDOM" -w "\nHTTP %{http_code}\n" || true
